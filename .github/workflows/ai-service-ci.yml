name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-ci.txt

      - name: Install CI dependencies (lightweight, no ML stack)
        run: pip install -r requirements-ci.txt

      - name: Lint
        run: ruff check app tests

      - name: Run unit tests
        run: pytest tests/unit -q
